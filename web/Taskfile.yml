version: "3"

vars:
  SERVICE_NAME: web
  IMAGE_NAME: "{{.SERVICE_NAME}}-dev"
  DAGGER_RUN: "dagger run python infra/dagger/cli.py"
  DOCKER_RUN: "docker run --rm -v $PWD:/app {{.IMAGE_NAME}}"

tasks:
  # build dev container
  build-dev:
    desc: Build local dev Docker container
    cmds:
      - DOCKER_BUILDKIT=1 docker build -f Dockerfile.dev -t {{.IMAGE_NAME}} .

  # drop into dev shell
  dev:
    desc: Start dev server in container
    deps: [build-dev]
    cmds:
      - |
        docker run --rm -it \
        -v $PWD:/app \
        -p 5173:5173 \
        {{.IMAGE_NAME}}

  # build prod container
  build-prod:
    desc: Build production container
    cmds:
      - DOCKER_BUILDKIT=1 docker build -t {{.SERVICE_NAME}} .

  # serve prod container
  preview-prod:
    desc: Serve built site (optional)
    cmds:
      - docker run --rm -p 8080:80 {{.SERVICE_NAME}}

  # run all checks via dagger
  all-checks:
    desc: Run all checks for {{.SERVICE_NAME}} via Dagger
    dir: ../..
    cmds:
      - "{{.DAGGER_RUN}} all-checks-for-service {{.SERVICE_NAME}}"

  # run lint via dagger
  lint:
    desc: Run lint check
    dir: ../..
    cmds:
      - "{{.DAGGER_RUN}} check {{.SERVICE_NAME}} lint"

  # run typecheck via dagger
  typecheck:
    desc: Run typecheck
    dir: ../..
    cmds:
      - "{{.DAGGER_RUN}} check {{.SERVICE_NAME}} typecheck"

  # run tests via dagger
  test:
    desc: Run tests (if applicable)
    dir: ../..
    cmds:
      - "{{.DAGGER_RUN}} check {{.SERVICE_NAME}} test"

  # run job
  job:
    desc: Run job (task job -- dev)
    cmds:
      - "{{.DAGGER_RUN}} job {{.SERVICE_NAME}} {{.CLI_ARGS}}"
