version: "3"

vars:
  SERVICE_NAME: transformation-engine
  IMAGE_NAME: "{{.SERVICE_NAME}}-dev"
  DAGGER_SCRIPT: "infra/dagger/run_ci_pipeline.py"
  DOCKER_RUN: "docker run --rm -v $PWD:/app {{.IMAGE_NAME}}"
  DAGGER_RUN: "dagger run python {{.DAGGER_SCRIPT}}"

tasks:
  # === Build + Dev Shell ===

  build:
    desc: Build local dev Docker container (if you want an interactive shell)
    cmds:
      - DOCKER_BUILDKIT=1 docker build -t {{.IMAGE_NAME}} .

  dev:
    desc: Start an interactive shell inside the local Docker container
    deps: [build]
    cmds:
      - docker run --rm -it -v $PWD:/app {{.IMAGE_NAME}} /bin/bash

  # === Precommit + CI ===

  precommit:
    desc: Run pre-commit hooks on all files
    cmds:
      - pre-commit run --all-files

  # === Dagger Checks ===

  dbt-parse:
    desc: Run dbt parse via Dagger
    dir: ../..
    cmds:
      - "{{.DAGGER_RUN}} dbt-parse {{.SERVICE_NAME}}"

  dbt-deps:
    desc: Run dbt deps via Dagger
    dir: ../..
    cmds:
      - "{{.DAGGER_RUN}} dbt-deps {{.SERVICE_NAME}}"

  dbt-test:
    desc: Run dbt test via Dagger
    dir: ../..
    cmds:
      - "{{.DAGGER_RUN}} dbt-test {{.SERVICE_NAME}}"

  dbt-build:
    desc: Run dbt build via Dagger
    dir: ../..
    cmds:
      - "{{.DAGGER_RUN}} dbt-build {{.SERVICE_NAME}}"

  all-checks:
    desc: Run all Dagger checks in parallel (recommended for CI)
    dir: ../..
    cmds:
      - "{{.DAGGER_RUN}} all-checks {{.SERVICE_NAME}}"
