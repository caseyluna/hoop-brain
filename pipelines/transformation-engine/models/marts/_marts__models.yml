version: 2

models:
  - name: teams
    description: NBA + WNBA teams mart. Union of stg_nba_api__teams and stg_wehoop__teams, disambiguated by league — no cross-source matching needed since teams aren't entity-resolved. sync-engine's sync_jobs.yaml points its teams job at this view.
    columns:
      - name: league
        description: NBA or WNBA.
        tests:
          - not_null
          - accepted_values:
              values: ["NBA", "WNBA"]
