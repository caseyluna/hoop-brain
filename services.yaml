# services.yaml
services:
  api:
    type: fastapi
    src_dir: api
    description: "Main FastAPI backend"
    dependencies: [db, sync-engine]
    checks:
      lint: ["uv", "run", "ruff", "format", "--check", "."]
      typecheck: ["uv", "run", "ruff", "check", "."]
    jobs:
      run-main:
        ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
  db:
    type: postgres
    src_dir: db/postgres
    description: "Postgres database"
    dependencies: []
    checks: {}
    jobs: {}

  web:
    type: react
    src_dir: web
    description: "Frontend React app"
    dependencies: []
    checks:
      lint: ["npm", "run", "lint"]
      typecheck: ["npm", "run", "typecheck"]
      build: ["npm", "run", "build"]
      test: ["npm", "run", "test"]
    jobs:
      dev: ["npm", "run", "dev"]

  ingestion-engine:
    type: python
    src_dir: pipelines/ingestion-engine
    description: "Ingestion engine"
    dependencies: []
    checks:
      lint: ["uv", "run", "ruff", "format", "--check", "."]
      typecheck: ["uv", "run", "ruff", "check", "."]
      test: ["uv", "run", "pytest", "tests"]
      coverage:
        [
          "uv",
          "run",
          "pytest",
          "--cov=ingestion_engine",
          "--cov-report=html:coverage.html",
          "tests",
        ]
    jobs:
      run-main: ["uv", "run", "python", "src/main.py"]

  model-engine:
    type: python
    src_dir: pipelines/model-engine
    description: "Model engine"
    dependencies: []
    checks:
      lint: ["uv", "run", "ruff", "format", "--check", "."]
      typecheck: ["uv", "run", "ruff", "check", "."]
      test: ["uv", "run", "pytest", "tests"]
      coverage:
        [
          "uv",
          "run",
          "pytest",
          "--cov=model_engine",
          "--cov-report=html:coverage.html",
          "tests",
        ]
    jobs:
      run-main: ["uv", "run", "python", "src/main.py"]

  sync-engine:
    type: python
    src_dir: pipelines/sync-engine
    description: "Sync engine"
    dependencies: [db]
    checks:
      lint: ["uv", "run", "ruff", "format", "--check", "."]
      typecheck: ["uv", "run", "ruff", "check", "."]
      test: ["uv", "run", "pytest", "tests"]
      coverage:
        [
          "uv",
          "run",
          "pytest",
          "--cov=sync_engine",
          "--cov-report=html:coverage.html",
          "tests",
        ]
    jobs:
      run-main: ["uv", "run", "python", "src/main.py"]

  transformation-engine:
    type: dbt
    src_dir: pipelines/transformation-engine
    description: "DBT transformation engine"
    dependencies: []
    checks:
      dbt-parse: ["dbt", "parse", "--profiles-dir", "/app/profiles"]
      dbt-deps: ["dbt", "deps", "--profiles-dir", "/app/profiles"]
      dbt-test: ["dbt", "test", "--profiles-dir", "/app/profiles"]
      dbt-build: ["dbt", "build", "--profiles-dir", "/app/profiles"]
    jobs:
      run-dbt-build: ["dbt", "build", "--profiles-dir", "/app/profiles"]
