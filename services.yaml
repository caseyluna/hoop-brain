# services.yaml
services:
  api:
    type: fastapi
    src_dir: api
    checks:
      lint: ["uv", "run", "ruff", "format", "--check", "."]
      typecheck: ["uv", "run", "ruff", "check", "."]
      test: ["sh", "-c", "uv run alembic upgrade head && uv run pytest tests"]
    jobs:
      run-main:
        ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
      alembic-upgrade: ["uv", "run", "alembic", "upgrade", "head"]
      alembic-revision: ["alembic", "revision", "--autogenerate", "-m"]

  web:
    type: react
    src_dir: web
    checks:
      lint: ["npm", "run", "lint"]
      typecheck: ["npm", "run", "typecheck"]
      build: ["npm", "run", "build"]
    jobs:
      dev: ["npm", "run", "dev"]

  ingestion-engine:
    type: python
    src_dir: pipelines/ingestion-engine
    checks:
      lint: ["uv", "run", "ruff", "format", "--check", "."]
      typecheck: ["uv", "run", "ruff", "check", "."]
      test: ["uv", "run", "pytest", "tests"]
      coverage:
        [
          "uv",
          "run",
          "pytest",
          "--cov=ingestion_engine",
          "--cov-report=html:coverage.html",
          "tests",
        ]
    jobs:
      run-main: ["uv", "run", "python", "src/main.py"]

  model-engine:
    type: python
    src_dir: pipelines/model-engine
    checks:
      lint: ["uv", "run", "ruff", "format", "--check", "."]
      typecheck: ["uv", "run", "ruff", "check", "."]
      test: ["uv", "run", "pytest", "tests"]
      coverage:
        [
          "uv",
          "run",
          "pytest",
          "--cov=model_engine",
          "--cov-report=html:coverage.html",
          "tests",
        ]
    jobs:
      run-main: ["uv", "run", "python", "src/main.py"]

  sync-engine:
    type: python
    src_dir: pipelines/sync-engine
    checks:
      lint: ["uv", "run", "ruff", "format", "--check", "."]
      typecheck: ["uv", "run", "ruff", "check", "."]
      test: ["uv", "run", "pytest", "tests"]
      coverage:
        [
          "uv",
          "run",
          "pytest",
          "--cov=sync_engine",
          "--cov-report=html:coverage.html",
          "tests",
        ]
    jobs:
      run-main: ["uv", "run", "python", "src/main.py"]

  transformation-engine:
    type: dbt
    src_dir: pipelines/transformation-engine
    checks:
      dbt-parse: ["dbt", "parse", "--profiles-dir", "/app/profiles"]
      dbt-deps: ["dbt", "parse", "--profiles-dir", "/app/profiles"]
      dbt-test: ["dbt", "test", "--profiles-dir", "/app/profiles"]
      dbt-build: ["dbt", "build", "--profiles-dir", "/app/profiles"]
    jobs:
      run-dbt-build: ["dbt", "build", "--profiles-dir", "/app/profiles"]
