version: "3"

vars:
  SERVICE_NAME: api
  IMAGE_NAME: "{{.SERVICE_NAME}}-dev"
  DAGGER_SCRIPT: infra/dagger/cli.py
  DAGGER_RUN: "dagger run python {{.DAGGER_SCRIPT}}"

tasks:
  build:
    desc: build local docker image for api (if needed)
    cmds:
      - docker_buildkit=1 docker build -t {{.SERVICE_NAME}}-dev .

  dev:
    desc: Run a shell in the API dev container (with code mounted, for live editing)
    deps: [build]
    cmds:
      - |
        docker run --rm -it \
          -p 8000:8000 \
          -v $PWD/app:/app/app \
          -v $PWD/tests:/app/tests \
          -e DATABASE_URL=postgresql://postgres:postgres@localhost:5432/hoopbrain_dev \
          {{.SERVICE_NAME}}-dev /bin/bash

  lint:
    desc: Run lint check for {{.SERVICE_NAME}}
    dir: ..
    cmds:
      - "{{.DAGGER_RUN}} check {{.SERVICE_NAME}} lint"

  typecheck:
    desc: Run typecheck for {{.SERVICE_NAME}}
    dir: ..
    cmds:
      - "{{.DAGGER_RUN}} check {{.SERVICE_NAME}} typecheck"

  test:
    desc: Run tests for {{.SERVICE_NAME}}
    dir: ..
    cmds:
      - "{{.DAGGER_RUN}} check {{.SERVICE_NAME}} test"

  all-checks:
    desc: Run all CI checks for {{.SERVICE_NAME}}
    dir: ..
    cmds:
      - "{{.DAGGER_RUN}} all-checks-for-service {{.SERVICE_NAME}}"

  alembic-revision:
    desc: create an alembic migration with a message
    dir: ..
    vars:
      msg: ""
    cmds:
      - "{{.DAGGER_RUN}} job api alembic-revision '{{.MSG}}'"

  job:
    desc: run job — (task job -- run-main)
    cmds:
      - |
        {{.DAGGER_RUN}} job {{.SERVICE_NAME}} {{.CLI_ARGS}}
