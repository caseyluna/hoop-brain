[project]
name = "api"
version = "0.1.0"
description = "HoopBrain API"
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    "alembic>=1.14.1",
    "fastapi[all]>=0.116.1",
    "psycopg2-binary>=2.9.10",
    "pydantic>=2.10.6",
    "ruff>=0.12.5",
    "sqlalchemy>=2.0.41",
    "uvicorn>=0.33.0",
]

[tool.setuptools]
package-dir = { "" = "app" }

[tool.setuptools.packages.find]
where = ["app"]
