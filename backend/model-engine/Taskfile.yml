version: "3"

vars:
  SERVICE_NAME: model-engine
  IMAGE_NAME: "{{.SERVICE_NAME}}-dev"
  DAGGER_SCRIPT: "infra/dagger/pipeline.py"
  DOCKER_RUN: "docker run --rm -v $PWD:/app {{.IMAGE_NAME}}"
  DAGGER_RUN: "dagger run python {{.DAGGER_SCRIPT}}"

tasks:
  # === Build + Dev Shell ===

  build:
    desc: Build local dev Docker container (if you want an interactive shell)
    cmds:
      - DOCKER_BUILDKIT=1 docker build -t {{.IMAGE_NAME}} .

  dev:
    desc: Start an interactive shell inside the local Docker container
    deps: [build]
    cmds:
      - docker run --rm -it -v $PWD:/app {{.IMAGE_NAME}} /bin/bash

  # === Precommit + CI ===

  precommit:
    desc: Run pre-commit hooks on all files
    cmds:
      - pre-commit run --all-files

  # === Dagger Checks ===

  lint:
    desc: Run lint via Dagger
    dir: ../..
    vars:
      DAGGER_FORCE_REBUILD: '{{if eq .FORCE_REBUILD "true"}}--force-rebuild{{end}}'
    cmds:
      - "{{.DAGGER_RUN}} lint {{.SERVICE_NAME}} {{.DAGGER_FORCE_REBUILD}}"

  typecheck:
    desc: Run typecheck via Dagger
    dir: ../..
    vars:
      DAGGER_FORCE_REBUILD: '{{if eq .FORCE_REBUILD "true"}}--force-rebuild{{end}}'
    cmds:
      - "{{.DAGGER_RUN}} typecheck {{.SERVICE_NAME}} {{.DAGGER_FORCE_REBUILD}}"

  test:
    desc: Run tests via Dagger
    dir: ../..
    vars:
      DAGGER_FORCE_REBUILD: '{{if eq .FORCE_REBUILD "true"}}--force-rebuild{{end}}'
    cmds:
      - "{{.DAGGER_RUN}} test {{.SERVICE_NAME}} {{.DAGGER_FORCE_REBUILD}}"

  coverage:
    desc: Run test coverage via Dagger
    dir: ../..
    vars:
      DAGGER_FORCE_REBUILD: '{{if eq .FORCE_REBUILD "true"}}--force-rebuild{{end}}'
    cmds:
      - "{{.DAGGER_RUN}} coverage {{.SERVICE_NAME}} {{.DAGGER_FORCE_REBUILD}}"

  all-checks:
    desc: Run all Dagger checks in parallel (recommended for CI)
    dir: ../..
    vars:
      DAGGER_FORCE_REBUILD: '{{if eq .FORCE_REBUILD "true"}}--force-rebuild{{end}}'
    cmds:
      - "{{.DAGGER_RUN}} all-checks {{.SERVICE_NAME}} {{.DAGGER_FORCE_REBUILD}}"
