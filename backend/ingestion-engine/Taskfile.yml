version: "3"

vars:
  SERVICE_NAME: ingestion-engine
  IMAGE_NAME: "{{.SERVICE_NAME}}-dev"
  DAGGER_RUN: "dagger run python infra/dagger/run_ci_pipeline.py"
  DOCKER_RUN: "docker run --rm -v $PWD:/app {{.IMAGE_NAME}}"

tasks:
  # === Build + Dev Shell ===

  build:
    desc: Build local dev Docker container (if you want an interactive shell)
    cmds:
      - DOCKER_BUILDKIT=1 docker build -t {{.IMAGE_NAME}} .

  dev:
    desc: Start an interactive shell inside the local Docker container
    deps: [build]
    cmds:
      - docker run --rm -it -v $PWD:/app {{.IMAGE_NAME}} /bin/bash

  # === Precommit + CI ===

  precommit:
    desc: Run pre-commit hooks on all files
    cmds:
      - pre-commit run --all-files

  # === Dagger Checks ===

  all-checks:
    desc: Run all CI checks for {{.SERVICE_NAME}}
    dir: ../..
    cmds:
      - "{{.DAGGER_RUN}} all-checks {{.SERVICE_NAME}}"

  lint:
    desc: Run lint check for {{.SERVICE_NAME}}
    dir: ../..
    cmds:
      - "{{.DAGGER_RUN}} lint {{.SERVICE_NAME}}"

  typecheck:
    desc: Run typecheck for {{.SERVICE_NAME}}
    dir: ../..
    cmds:
      - "{{.DAGGER_RUN}} typecheck {{.SERVICE_NAME}}"

  test:
    desc: Run tests for {{.SERVICE_NAME}}
    dir: ../..
    cmds:
      - "{{.DAGGER_RUN}} test {{.SERVICE_NAME}}"

  coverage:
    desc: Run test coverage for {{.SERVICE_NAME}}
    dir: ../..
    cmds:
      - "{{.DAGGER_RUN}} coverage {{.SERVICE_NAME}}"
