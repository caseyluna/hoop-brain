name: Code Checks

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed_services: ${{ steps.set-changes.outputs.changed_services }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed services
        id: set-changes
        run: |
          git fetch origin main
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          SERVICES=()
          if echo "$CHANGED_FILES" | grep -q '^backend/ingestion-engine/'; then
            SERVICES+=("ingestion-engine")
          fi
          if echo "$CHANGED_FILES" | grep -q '^backend/model-engine/'; then
            SERVICES+=("model-engine")
          fi
          if echo "$CHANGED_FILES" | grep -q '^backend/transformation-engine/'; then
            SERVICES+=("transformation-engine")
          fi
          echo "Detected changed services: ${SERVICES[*]}"
          echo "changed_services=${SERVICES[*]}" >> $GITHUB_OUTPUT

  code-checks:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [ingestion-engine, model-engine, transformation-engine]
        include:
          - service: ingestion-engine
            checks: "lint typecheck test coverage"
          - service: model-engine
            checks: "lint typecheck test coverage"
          - service: transformation-engine
            checks: "dbt-parse dbt-deps dbt-test dbt-build"
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install Dagger CLI
        run: |
          curl -L https://dl.dagger.io/dagger/install.sh | sh
          echo "$HOME/.dagger/bin" >> $GITHUB_PATH

      - name: Run checks for ${{ matrix.service }}
        if: contains(needs.detect-changes.outputs.changed_services, matrix.service)
        run: |
          for check in ${{ matrix.checks }}; do
            echo "🔧 Running $check for ${{ matrix.service }}"
            dagger run python infra/dagger/run_ci_pipeline.py $check ${{ matrix.service }}
          done
