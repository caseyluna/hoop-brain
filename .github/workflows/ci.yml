name: Dagger CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed_services: ${{ steps.set-changes.outputs.changed_services }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Detect changed services
        id: set-changes
        run: |
          git fetch origin main || true
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD || echo "")

          SERVICES=()
          if echo "$CHANGED_FILES" | grep -q '^api/'; then
            SERVICES+=("api")
          fi
          if echo "$CHANGED_FILES" | grep -q '^web/'; then
            SERVICES+=("web")
          fi
          if echo "$CHANGED_FILES" | grep -q '^pipelines/sync-engine/'; then
            SERVICES+=("sync-engine")
          fi
          if echo "$CHANGED_FILES" | grep -q '^pipelines/ingestion-engine/'; then
            SERVICES+=("ingestion-engine")
          fi
          if echo "$CHANGED_FILES" | grep -q '^pipelines/model-engine/'; then
            SERVICES+=("model-engine")
          fi
          if echo "$CHANGED_FILES" | grep -q '^pipelines/transformation-engine/'; then
            SERVICES+=("transformation-engine")
          fi

          echo "Detected changed services: ${SERVICES[*]}"
          echo "changed_services=${SERVICES[*]}" >> $GITHUB_OUTPUT

  run-ci:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - service: api
            pipeline: api-ci
          - service: web
            pipeline: web-ci
          - service: sync-engine
            pipeline: sync-engine-ci
          - service: ingestion-engine
            pipeline: ingestion-engine-ci
          - service: model-engine
            pipeline: model-engine-ci
          - service: transformation-engine
            pipeline: transformation-engine-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv (if needed)
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install Dagger CLI
        run: |
          curl -L https://dl.dagger.io/dagger/install.sh | sh
          echo "$HOME/.dagger/bin" >> $GITHUB_PATH

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Sync Python deps if pyproject exists
        run: |
          if [ -f "pyproject.toml" ]; then
            uv sync
          fi

      - name: Run Dagger pipeline for ${{ matrix.service }}
        if: contains(needs.detect-changes.outputs.changed_services, matrix.service)
        run: |
          dagger run python infra/dagger/cli.py ${{ matrix.pipeline }}
