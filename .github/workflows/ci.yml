name: Dagger CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api:
    name: API CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: arduino/setup-task@v2

      - name: Install dagger + uv
        run: |
          pip install uv
          curl -L https://dl.dagger.io/dagger/install.sh | sh

      - name: Run API pipeline
        run: dagger run python infra/dagger/cli.py api-ci

  web:
    name: Web CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: arduino/setup-task@v2

      - name: Install dagger
        run: curl -L https://dl.dagger.io/dagger/install.sh | sh

      - name: Run Web pipeline
        run: dagger run python infra/dagger/cli.py web-ci

  sync-engine:
    name: Sync Engine CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: arduino/setup-task@v2
      - run: pip install uv
      - run: curl -L https://dl.dagger.io/dagger/install.sh | sh
      - run: dagger run python infra/dagger/cli.py sync-engine-ci

  ingestion-engine:
    name: Ingestion Engine CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: arduino/setup-task@v2
      - run: pip install uv
      - run: curl -L https://dl.dagger.io/dagger/install.sh | sh
      - run: dagger run python infra/dagger/cli.py ingestion-engine-ci

  model-engine:
    name: Model Engine CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: arduino/setup-task@v2
      - run: pip install uv
      - run: curl -L https://dl.dagger.io/dagger/install.sh | sh
      - run: dagger run python infra/dagger/cli.py model-engine-ci

  transformation-engine:
    name: Transformation Engine CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: arduino/setup-task@v2
      - run: pip install dbt-core dbt-bigquery uv
      - run: curl -L https://dl.dagger.io/dagger/install.sh | sh
      - run: dagger run python infra/dagger/cli.py transformation-engine-ci
