name: CI

on:
  push:
    branches:
      - main
    paths:
      - "api/**"
      - "web/**"
      - "pipelines/**"
      - "docker-compose.yaml"
      - "Taskfile.yml"
      - ".github/**"
  pull_request:
    branches:
      - main
    paths:
      - "api/**"
      - "web/**"
      - "pipelines/**"
      - "docker-compose.yaml"
      - "Taskfile.yml"
      - ".github/**"

jobs:
  service-ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - web
          - sync-engine
          - ingestion-engine
          - model-engine
          - transformation-engine

    steps:
      - uses: actions/checkout@v4

      - name: Prepare dummy GCP credentials
        run: |
          mkdir -p keys
          echo '{}' > keys/service_account.json

      - name: Ensure DBT profiles (transformation-engine only)
        if: ${{ matrix.service == 'transformation-engine' }}
        run: |
          mkdir -p pipelines/transformation-engine/profiles
          cat << 'EOF' > pipelines/transformation-engine/profiles/profiles.yml
          transformation_engine:
            outputs:
              dev:
                type: postgres
                threads: 1
                host: db
                port: 5432
                user: postgres
                pass: postgres
                dbname: hoopbrain_test
                schema: public
            target: dev
          EOF

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: "3.x"

      - name: Build ${{ matrix.service }} image
        run: |
          NAMESPACE="${{ matrix.service }}"
          NAMESPACE="${NAMESPACE%-engine}"
          task "${NAMESPACE}:build"

      - name: Run ${{ matrix.service }} CI checks
        run: |
          NAMESPACE="${{ matrix.service }}"
          NAMESPACE="${NAMESPACE%-engine}"
          task "${NAMESPACE}:ci"
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON || '{}' }}

  integration-test:
    name: Integration Test
    needs: service-ci
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Prepare real GCP credentials
        run: |
          if [ -z "${GCP_SERVICE_ACCOUNT_JSON}" ]; then
            echo "::error::GCP_SERVICE_ACCOUNT_JSON must be set"
            exit 1
          fi
          mkdir -p keys
          cat << 'EOF' > keys/service_account.json
          ${GCP_SERVICE_ACCOUNT_JSON}
          EOF
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

      - name: Ensure .env.test
        run: |
          cat << 'EOF' > .env.test
          POSTGRES_DB=hoopbrain_test
          PGPASSWORD=postgres
          DATABASE_URL=postgresql://postgres:postgres@db:5432/hoopbrain_test
          GOOGLE_APPLICATION_CREDENTIALS=/keys/service_account.json
          EOF

      - name: Ensure DBT profiles
        run: |
          mkdir -p pipelines/transformation-engine/profiles
          cat << 'EOF' > pipelines/transformation-engine/profiles/profiles.yml
          transformation_engine:
            outputs:
              dev:
                type: postgres
                threads: 1
                host: db
                port: 5432
                user: postgres
                pass: postgres
                dbname: hoopbrain_test
                schema: public
            target: dev
          EOF

      - name: Install Task
        uses: arduino/setup-task@v2
        with:
          version: "3.x"

      - name: Run integration test
        run: task integration-test
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
