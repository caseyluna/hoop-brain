name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed_services: ${{ steps.set-changes.outputs.changed_services }}
    steps:
      - uses: actions/checkout@v4

      - id: set-changes
        run: |
          git fetch origin main
          CHANGED_FILES=$(git diff --name-only origin/main...HEAD)
          SERVICES=()
          if echo "$CHANGED_FILES" | grep -q '^pipelines/ingestion-engine/'; then
            SERVICES+=("ingestion-engine")
          fi
          if echo "$CHANGED_FILES" | grep -q '^pipelines/model-engine/'; then
            SERVICES+=("model-engine")
          fi
          if echo "$CHANGED_FILES" | grep -q '^pipelines/transformation-engine/'; then
            SERVICES+=("transformation-engine")
          fi
          if echo "$CHANGED_FILES" | grep -q '^pipelines/sync-engine/'; then
            SERVICES+=("sync-engine")
          fi
          if echo "$CHANGED_FILES" | grep -q '^api/'; then
            SERVICES+=("api")
          fi
          if echo "$CHANGED_FILES" | grep -q '^web/'; then
            SERVICES+=("web")
          fi
          echo "changed_services=${SERVICES[*]}" >> $GITHUB_OUTPUT

  code-checks:
    needs: detect-changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          [
            api,
            web,
            sync-engine,
            ingestion-engine,
            model-engine,
            transformation-engine,
          ]
        include:
          - service: api
            pipeline: api-ci
          - service: web
            pipeline: web-ci
          - service: sync-engine
            pipeline: sync-engine-ci
          - service: ingestion-engine
            pipeline: ingestion-engine-ci
          - service: model-engine
            pipeline: model-engine-ci
          - service: transformation-engine
            pipeline: transformation-engine-ci
    if: contains(needs.detect-changes.outputs.changed_services, matrix.service)
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: |
          curl -sSfL https://github.com/astral-sh/uv/releases/latest/download/uv-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          chmod +x uv && sudo mv uv /usr/local/bin/

      - name: Sync Python deps if needed
        run: |
          if [ -f pyproject.toml ]; then
            uv sync
          fi

      - name: Install Dagger
        run: |
          curl -L https://github.com/dagger/dagger/releases/download/v0.11.6/dagger_v0.11.6_linux_amd64.tar.gz | tar -xz
          chmod +x dagger && sudo mv dagger /usr/local/bin/

      - name: Run ${{ matrix.pipeline }}
        run: dagger run python infra/dagger/cli.py ${{ matrix.pipeline }}
