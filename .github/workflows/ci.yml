name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - web
          - sync-engine
          - ingestion-engine
          - model-engine
          - transformation-engine

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # 1) Create the keys folder & write your service account
      - name: Configure GCP credentials
        run: |
          mkdir -p keys
          echo "${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}" > keys/service_account.json

      # 2) Install Python & CLI deps
      - name: Set up Python & install CLI deps
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install dagger-io anyio pyyaml python-dotenv

      # 3) Install the Dagger binary
      - name: Install Dagger CLI
        run: |
          curl -L https://github.com/dagger/dagger/releases/download/v0.11.6/dagger_v0.11.6_linux_amd64.tar.gz \
            | tar -xz dagger
          sudo mv dagger /usr/local/bin/

      # 4) uv sync for Python services
      - name: uv sync (if needed)
        run: |
          SRCDIR="${{ matrix.service }}"
          if [ -f "$SRCDIR/pyproject.toml" ] || [ -f "pipelines/$SRCDIR/pyproject.toml" ]; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.cargo/bin:$PATH"
            if [ -d "pipelines/$SRCDIR" ]; then
              cd "pipelines/$SRCDIR"
            else
              cd "$SRCDIR"
            fi
            uv sync
          fi

      # 5) Run the service's Dagger pipeline
      - name: Run ${{ matrix.service }} pipeline
        run: dagger run python infra/dagger/cli.py ${{ matrix.service }}-ci
