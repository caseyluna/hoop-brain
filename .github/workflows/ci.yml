name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  service-ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service:
          - api
          - web
          - sync-engine
          - ingestion-engine
          - model-engine
          - transformation-engine

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GCP credentials
        run: |
          mkdir -p keys
          if [ -n "${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}" ]; then
            printf '%s' "${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}" > keys/service_account.json
          else
            touch keys/service_account.json
          fi

      - name: Generate DBT profiles
        run: |
          mkdir -p pipelines/transformation-engine/profiles
          echo "default:" > pipelines/transformation-engine/profiles/profiles.yml
          echo "  outputs:" >> pipelines/transformation-engine/profiles/profiles.yml
          echo "    dev:" >> pipelines/transformation-engine/profiles/profiles.yml
          echo "      type: postgres" >> pipelines/transformation-engine/profiles/profiles.yml
          echo "      threads: 1" >> pipelines/transformation-engine/profiles/profiles.yml
          echo "      host: db" >> pipelines/transformation-engine/profiles/profiles.yml
          echo "      port: 5432" >> pipelines/transformation-engine/profiles/profiles.yml
          echo "      user: postgres" >> pipelines/transformation-engine/profiles/profiles.yml
          echo "      pass: postgres" >> pipelines/transformation-engine/profiles/profiles.yml
          echo "      dbname: hoopbrain_test" >> pipelines/transformation-engine/profiles/profiles.yml
          echo "      schema: public" >> pipelines/transformation-engine/profiles/profiles.yml
          echo "  target: dev" >> pipelines/transformation-engine/profiles/profiles.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CLI Python packages
        run: pip install dagger-io anyio pyyaml python-dotenv

      - name: Install Dagger CLI
        run: |
          curl -L https://github.com/dagger/dagger/releases/download/v0.11.6/dagger_v0.11.6_linux_amd64.tar.gz \
            | tar -xz dagger
          sudo mv dagger /usr/local/bin/

      - name: uv sync if needed
        run: |
          SRCDIR="${{ matrix.service }}"
          if [ -f "$SRCDIR/pyproject.toml" ] || [ -f "pipelines/$SRCDIR/pyproject.toml" ]; then
            curl -LsSf https://astral.sh/uv/install.sh | sh
            export PATH="$HOME/.cargo/bin:$PATH"
            if [ -d "pipelines/$SRCDIR" ]; then
              cd pipelines/$SRCDIR
            else
              cd "$SRCDIR"
            fi
            uv sync
          fi

      - name: List files for debugging
        run: ls -lR

      - name: Run ${{ matrix.service }} pipeline
        run: |
          dagger run python infra/dagger/cli.py ${{ matrix.service }}-ci

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    needs: service-ci
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure GCP credentials
        run: |
          mkdir -p keys
          if [ -n "${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}" ]; then
            printf '%s' "${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}" > keys/service_account.json
          else
            touch keys/service_account.json
          fi

      - name: Generate DBT profiles
        run: |
          mkdir -p pipelines/transformation-engine/profiles
          echo "default:" > pipelines/transformation-engine/profiles/profiles.yml
          echo "  outputs:" >> pipelines/transformation-engine/profiles/profiles.yml
          echo "    dev:" >> pipelines/transformation-engine/profiles/profiles.yml
          echo "      type: postgres" >> pipelines/transformation-engine/profiles/profiles.yml
          echo "      threads: 1" >> pipelines/transformation-engine/profiles/profiles.yml
          echo "      host: db" >> pipelines/transformation-engine/profiles/profiles.yml
          echo "      port: 5432" >> pipelines/transformation-engine/profiles/profiles.yml
          echo "      user: postgres" >> pipelines/transformation-engine/profiles/profiles.yml
          echo "      pass: postgres" >> pipelines/transformation-engine/profiles/profiles.yml
          echo "      dbname: hoopbrain_test" >> pipelines/transformation-engine/profiles/profiles.yml
          echo "      schema: public" >> pipelines/transformation-engine/profiles/profiles.yml
          echo "  target: dev" >> pipelines/transformation-engine/profiles/profiles.yml

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CLI Python packages
        run: pip install dagger-io anyio pyyaml python-dotenv

      - name: Install Dagger CLI
        run: |
          curl -L https://github.com/dagger/dagger/releases/download/v0.11.6/dagger_v0.11.6_linux_amd64.tar.gz \
            | tar -xz dagger
          sudo mv dagger /usr/local/bin/

      - name: List files for debugging
        run: ls -lR

      - name: Run Integration Test pipeline
        run: |
          dagger run python infra/dagger/cli.py integration-test
