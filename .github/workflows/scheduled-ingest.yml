name: Scheduled Ingestion

on:
  schedule:
    # 08:00 UTC daily = ~3-4am US Eastern, off-peak
    - cron: "0 8 * * *"
  workflow_dispatch:

concurrency:
  group: scheduled-ingest
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  scheduled-ingest:
    name: ingest -> BQ -> dbt -> sync
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Prepare real GCP credentials
        id: gcp-creds
        run: |
          if [ -z "${GCP_SERVICE_ACCOUNT_JSON}" ]; then
            echo "::error::GCP_SERVICE_ACCOUNT_JSON must be set"
            exit 1
          fi
          mkdir -p keys pipelines/transformation-engine/keys pipelines/ingestion-engine/keys
          printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > keys/service_account.json
          printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > pipelines/transformation-engine/keys/service_account.json
          printf '%s' "$GCP_SERVICE_ACCOUNT_JSON" > pipelines/ingestion-engine/keys/service_account.json
        env:
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}

      # CAL-152: sync-engine and the API's migrations now target the real
      # Neon database, not local Docker Postgres — the local `db` container
      # still comes up (docker-compose depends_on) but nothing reads from it
      # here. Pooled for sync-engine's runtime traffic; direct/unpooled for
      # Alembic (Neon's pooler can't run its session-level operations — see
      # api/alembic/env.py). ci.yml's PR-check flow is untouched and keeps
      # using the local ephemeral test Postgres, not this one.
      - name: Ensure .env.test
        id: env-test
        env:
          NEON_DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEON_DATABASE_URL_DIRECT: ${{ secrets.DATABASE_URL_DIRECT }}
        run: |
          if [ -z "${NEON_DATABASE_URL}" ] || [ -z "${NEON_DATABASE_URL_DIRECT}" ]; then
            echo "::error::DATABASE_URL and DATABASE_URL_DIRECT secrets must be set (see CAL-152)"
            exit 1
          fi
          cat << EOF > .env.test
          POSTGRES_DB=hoopbrain_test
          PGPASSWORD=postgres
          DATABASE_URL=${NEON_DATABASE_URL}
          DATABASE_URL_DIRECT=${NEON_DATABASE_URL_DIRECT}
          GOOGLE_APPLICATION_CREDENTIALS=/keys/service_account.json
          EOF

      - name: Ensure DBT profiles
        id: dbt-profiles
        run: |
          mkdir -p pipelines/transformation-engine/profiles
          cat << 'EOF' > pipelines/transformation-engine/profiles/profiles.yml
          transformation_engine:
            outputs:
              dev:
                type: bigquery
                method: service-account
                project: hoop-brain
                dataset: test
                threads: 4
                timeout_seconds: 300
                keyfile: /app/keys/service_account.json
            target: dev
          EOF

      - name: Install Task
        id: install-task
        uses: arduino/setup-task@v2
        with:
          version: "3.x"

      - name: Build service images
        id: build-images
        run: |
          task ingestion:build
          task api:build
          task sync:build
          task transformation:build

      - name: Apply Postgres migrations
        id: migrate
        run: task api:migrate-test

      - name: Ingest -> BQ -> dbt -> sync
        id: ingest-daily
        run: task ingest-daily 2>&1 | tee ingest-daily.log

      - name: Tear down local services
        if: always()
        run: docker compose down -v

      # Names the failed step and, for the composed ingest-daily task (which
      # wraps 6 sub-tasks — see root Taskfile.yml), pinpoints which sub-task
      # actually broke by parsing Task's own "Failed to run task ..." nesting
      # out of the captured log — then files/updates a GitHub issue so a
      # broken pipeline surfaces as an email within minutes instead of rotting
      # silently (see CAL-155: this repo is worked infrequently).
      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GCP_CREDS_OUTCOME: ${{ steps.gcp-creds.outcome }}
          ENV_TEST_OUTCOME: ${{ steps.env-test.outcome }}
          DBT_PROFILES_OUTCOME: ${{ steps.dbt-profiles.outcome }}
          INSTALL_TASK_OUTCOME: ${{ steps.install-task.outcome }}
          BUILD_IMAGES_OUTCOME: ${{ steps.build-images.outcome }}
          MIGRATE_OUTCOME: ${{ steps.migrate.outcome }}
          INGEST_DAILY_OUTCOME: ${{ steps.ingest-daily.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail

          # First (only, since Task stops the job at the first failing step)
          # step with outcome=="failure" is the one that broke the run.
          failed_step="unknown"
          [ "$GCP_CREDS_OUTCOME" = "failure" ] && failed_step="gcp-creds"
          [ "$ENV_TEST_OUTCOME" = "failure" ] && failed_step="env-test"
          [ "$DBT_PROFILES_OUTCOME" = "failure" ] && failed_step="dbt-profiles"
          [ "$INSTALL_TASK_OUTCOME" = "failure" ] && failed_step="install-task"
          [ "$BUILD_IMAGES_OUTCOME" = "failure" ] && failed_step="build-images"
          [ "$MIGRATE_OUTCOME" = "failure" ] && failed_step="migrate"
          [ "$INGEST_DAILY_OUTCOME" = "failure" ] && failed_step="ingest-daily"

          title="Scheduled pipeline failed"
          cause="Unrecognized failure point — check the run log directly."
          suggestion="Open the run and read the last failing step's log."

          if [ "$failed_step" = "ingest-daily" ] && [ -f ingest-daily.log ]; then
            # e.g. `task: Failed to run task "ingest-daily": task: Failed to
            # run task "sync:run-main": exit status 1` -> last match is the
            # innermost (actual) failing sub-task.
            sub_task=$(sed -n 's/.*Failed to run task "\([^"]*\)".*/\1/p' ingest-daily.log | tail -1 || true)
            failed_step="ingest-daily / ${sub_task:-unknown sub-task}"
            case "$sub_task" in
              ingestion:build)
                cause="ingestion-engine's Docker build failed."
                suggestion="Check for a broken Dockerfile or dependency change under pipelines/ingestion-engine/."
                ;;
              ingestion:run-main)
                cause="Ingestion itself failed. Most likely: an upstream API shape change (nba_api or ESPN's WNBA teams endpoint — this is the PRD's #1 likelihood risk, unofficial endpoints break without notice), a rate limit, or a GCP permissions problem writing to GCS/BigQuery."
                suggestion="Run \`task ingestion:build && task ingestion:run-main\` locally against the same GCP credential to reproduce, then check the source API's response shape."
                ;;
              transformation:build)
                cause="transformation-engine's Docker build failed."
                suggestion="Check for a broken Dockerfile or dependency change under pipelines/transformation-engine/."
                ;;
              transformation:dbt-build)
                cause="A dbt model or test failed against real BigQuery."
                suggestion="Check the run log for which model/test failed — usually a schema/type mismatch or a source table dbt expected that ingestion didn't create."
                ;;
              sync:build)
                cause="sync-engine's Docker build failed."
                suggestion="Check for a broken Dockerfile or dependency change under pipelines/sync-engine/."
                ;;
              sync:run-main)
                cause="The BigQuery -> Postgres sync failed. Often a schema mismatch — a NOT NULL violation or type mismatch between the BQ view and the Postgres table."
                suggestion="Compare the BQ view's columns/types against the Postgres table's schema (see pipelines/sync-engine/src/jobs/bq_to_postgres.py)."
                ;;
              *)
                cause="One of ingest-daily's sub-tasks failed (ingestion:build, ingestion:run-main, transformation:build, transformation:dbt-build, sync:build, sync:run-main) but the specific one couldn't be parsed from the log."
                suggestion="Open the run and read ingest-daily.log directly."
                ;;
            esac
          else
            case "$failed_step" in
              gcp-creds)
                cause="GCP_SERVICE_ACCOUNT_JSON secret is missing or empty."
                suggestion="Check Settings -> Secrets and variables -> Actions -> GCP_SERVICE_ACCOUNT_JSON hasn't expired or been removed."
                ;;
              env-test)
                cause="DATABASE_URL or DATABASE_URL_DIRECT secret is missing or empty (see CAL-152 — sync-engine and Alembic migrations now target Neon)."
                suggestion="Check Settings -> Secrets and variables -> Actions -> DATABASE_URL / DATABASE_URL_DIRECT hasn't expired or been removed. Get fresh values with \`neon connection-string --pooled\` / \`neon connection-string\` once the workspace is linked."
                ;;
              build-images)
                cause="One of the service Docker builds failed."
                suggestion="Check the run log for which service's build failed, then check for a broken Dockerfile or dependency change in that service's directory."
                ;;
              migrate)
                cause="Alembic migration failed against Neon."
                suggestion="Check for a new or conflicting migration under api/alembic/versions/, or that DATABASE_URL_DIRECT is still a valid direct (non -pooler) Neon connection string."
                ;;
            esac
          fi

          body=$(cat <<BODY_EOF
          ## What failed
          **Step:** \`${failed_step}\`
          **Run:** ${RUN_URL}

          ## Likely cause
          ${cause}

          ## Suggested next step
          ${suggestion}
          BODY_EOF
          )

          existing=$(gh issue list --search "in:title \"${title}\"" --state open --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "$title" --body "$body"
          fi
