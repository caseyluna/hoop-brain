version: "3"

tasks:
  ingestion:all-checks:
    desc: Run all checks for ingestion-engine
    cmds:
      - (cd backend/ingestion-engine && task all-checks)

  model:all-checks:
    desc: Run all checks for model-engine
    cmds:
      - (cd backend/model-engine && task all-checks)

  transformation:all-checks:
    desc: Run all checks for transformation-engine (dbt)
    cmds:
      - (cd backend/transformation-engine && task all-checks)

  all-checks:
    desc: Run all checks sequentially across all services
    cmds:
      - task ingestion:all-checks
      - task model:all-checks
      - task transformation:all-checks
