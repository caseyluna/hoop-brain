version: "3"

vars:
  DAGGER_SCRIPT: "infra/dagger/cli.py"
  DAGGER_RUN: "dagger run python {{.DAGGER_SCRIPT}}"
  ENV_FILE: .env.test

includes:
  ingestion:
    taskfile: ./pipelines/ingestion-engine/Taskfile.yml
    dir: ./pipelines/ingestion-engine

  model:
    taskfile: ./pipelines/model-engine/Taskfile.yml
    dir: ./pipelines/model-engine

  sync:
    taskfile: ./pipelines/sync-engine/Taskfile.yml
    dir: ./pipelines/sync-engine

  transformation:
    taskfile: ./pipelines/transformation-engine/Taskfile.yml
    dir: ./pipelines/transformation-engine

  api:
    taskfile: ./api/Taskfile.yml
    dir: ./api

  web:
    taskfile: ./web/Taskfile.yml
    dir: ./web

tasks:
  all-checks:
    desc: Run all checks on all services sequentially
    cmds:
      - task ingestion:all-checks
      - task model:all-checks
      - task transformation:all-checks
      - task api:all-checks
      - task web:all-checks

  ci-all:
    desc: Run Dagger pipeline for full CI
    cmds:
      - "{{.DAGGER_RUN}} ci-all"
  ci-backend:
    desc: Run backend CI pipeline
    cmds:
      - "{{.DAGGER_RUN}} ci-backend"
  ci-frontend:
    desc: Run frontend CI pipeline
    cmds:
      - "{{.DAGGER_RUN}} ci-frontend"
  lint:
    desc: Run lint-all pipeline
    cmds:
      - "{{.DAGGER_RUN}} lint-all"
  test:
    desc: Run test-all pipeline
    cmds:
      - "{{.DAGGER_RUN}} test-all"
  build:
    desc: Run build-all pipeline
    cmds:
      - "{{.DAGGER_RUN}} build-all"
  pipeline:
    desc: Run a named pipeline (task pipeline -- pipeline_name)
    cmds:
      - "{{.DAGGER_RUN}} {{.CLI_ARGS}}"
  integration-test:
    desc: Run full integration test (migrate, populate, test api)
    cmds:
      - |
        set -a
        source {{.ENV_FILE}}
        set +a
        {{.DAGGER_RUN}} integration-test
