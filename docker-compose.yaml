services:
  postgres:
    image: postgres:15
    container_name: hoopbrain-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: hoopbrain
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - hoopbrain

  api:
    build:
      context: ./api
    container_name: hoopbrain-api
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./api:/api
    env_file:
      - ./api/.env
    ports:
      - "8000:8000"
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/hoopbrain
    networks:
      - hoopbrain

  sync-engine:
    build:
      context: ./pipelines/sync-engine
      dockerfile: Dockerfile
    container_name: sync-engine
    volumes:
      - ./pipelines/sync-engine:/app
      - /Users/caseythayer/projects/hoop-brain/keys:/keys:ro
    env_file:
      - ./pipelines/sync-engine/.env
    depends_on:
      - postgres
    working_dir: /app
    entrypoint: ["/bin/bash"]
    stdin_open: true
    tty: true
    networks:
      - hoopbrain

volumes:
  postgres_data:

networks:
  hoopbrain:
